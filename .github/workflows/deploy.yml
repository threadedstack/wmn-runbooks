# Rebuilds this site with a wmn release and deploys it to Firebase Hosting (project wmn-runbooks) through ./deploy.sh.
# Runs when threadedstack/wmn-releases publishes a release (it sends repository_dispatch "wmn-release" with the version),
# when this repository's main changes (with the latest wmn release), or by hand.
# Sign-in is keyless: GitHub's OIDC token is exchanged for the gh-actions-deploy service account (Workload Identity Federation).
name: Deploy

on:
  repository_dispatch:
    types: [wmn-release]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "wmn version to build with (for example 0.1.77; empty: the latest release)"
        required: false

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/79296749603/locations/global/workloadIdentityPools/github/providers/github
          service_account: gh-actions-deploy@wmn-runbooks.iam.gserviceaccount.com

      - name: Install wmn
        env:
          VERSION: ${{ github.event.client_payload.version || inputs.version }}
        run: |
          v="${VERSION#v}"
          if [ -n "$v" ]; then base="https://github.com/threadedstack/wmn-releases/releases/download/v$v"
          else base="https://github.com/threadedstack/wmn-releases/releases/latest/download"; fi
          curl -fsSL "$base/install.sh" | WMN_INSTALL_BASE="$base" WMN_INSTALL_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/wmn" --version

      - name: Install the Firebase CLI
        run: npm install -g firebase-tools@15.16.0

      - name: Build and deploy
        run: WMN_BIN="$HOME/.local/bin/wmn" ./deploy.sh "$RUNNER_TEMP/site"
