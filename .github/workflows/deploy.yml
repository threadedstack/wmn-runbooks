# Rebuilds this site with a wmn release and deploys it to Firebase Hosting (project wmn-runbooks) through ./deploy.sh.
# Runs when threadedstack/wmn-releases publishes a release (it sends repository_dispatch "wmn-release" with the version),
# when this repository's main changes (with the newest wmn release), or by hand.
# Every site gets wmn the same way: the release's Linux binary (wmn-<version>-linux-x64) and its engine folder
# (wmn-engine-<version>.tar.gz), each checked against its .sha256; the build uses that engine through WMN_ENGINE_DIR.
# Sign-in is keyless: GitHub's OIDC token is exchanged for the gh-actions-deploy service account (Workload Identity Federation).
name: Deploy

on:
  repository_dispatch:
    types: [wmn-release]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "wmn version to build with (for example 0.1.77; empty: the newest release)"
        required: false

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/79296749603/locations/global/workloadIdentityPools/github/providers/github
          service_account: gh-actions-deploy@wmn-runbooks.iam.gserviceaccount.com

      - name: Get wmn and its engine
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.client_payload.version || inputs.version }}
        run: |
          v="${VERSION#v}"
          if [ -z "$v" ]; then
            v="$(gh release view --repo threadedstack/wmn-releases --json tagName -q .tagName)"
            v="${v#v}"
          fi
          base="https://github.com/threadedstack/wmn-releases/releases/download/v$v"
          get() { # a release file, checked against its .sha256
            curl -fsSL "$base/$1" -o "$RUNNER_TEMP/$1"
            want="$(curl -fsSL "$base/$1.sha256" | awk '{print $1}')"
            got="$(sha256sum "$RUNNER_TEMP/$1" | awk '{print $1}')"
            if [ -z "$want" ] || [ "$want" != "$got" ]; then echo "$1 does not match its sha256" >&2; exit 1; fi
          }
          get "wmn-$v-linux-x64"
          mkdir -p "$HOME/.local/bin" "$RUNNER_TEMP/engine"
          install -m 755 "$RUNNER_TEMP/wmn-$v-linux-x64" "$HOME/.local/bin/wmn"
          get "wmn-engine-$v.tar.gz"
          tar -C "$RUNNER_TEMP/engine" -xzf "$RUNNER_TEMP/wmn-engine-$v.tar.gz"
          rm "$RUNNER_TEMP/wmn-engine-$v.tar.gz" "$RUNNER_TEMP/wmn-$v-linux-x64"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "WMN_ENGINE_DIR=$RUNNER_TEMP/engine" >> "$GITHUB_ENV"
          "$HOME/.local/bin/wmn" --version

      - name: Install the Firebase CLI
        run: npm install -g firebase-tools@15.16.0

      - name: Build and deploy
        run: WMN_BIN="$HOME/.local/bin/wmn" ./deploy.sh "$RUNNER_TEMP/site"
