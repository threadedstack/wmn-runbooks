<script type="application/json" id="wmn-live-data">{"block":{"id":"histogram","title":"Histogram and CDF","params":{"column":{"type":"text","maxLength":64,"label":"Column"},"bins":{"type":"number","min":1,"max":100,"step":1,"value":12,"label":"Bins"},"mode":{"type":"select","options":["both","histogram","cdf"],"value":"both","label":"Show"},"title":{"type":"text","maxLength":80,"label":"Title"}},"package":"stdlib/charts@1.0.0"},"title":"Histogram and CDF","code":"// stdlib/charts: histogram and CDF of one numeric column (ROADMAP 6.34, D-214; the \"Latency Histogram \u0026 CDF\" of the block-authoring design).\n// Sent: its declared values (column, bins, mode, title) and the tables of the blocks the author named. The bin count and the mode are\n// controls in the view; a change is written back as one body line (api.set), so it saves with the document.\nconst SVGNS = \"http://www.w3.org/2000/svg\";\nconst put = (n, a, kids) =\u003e {\n  for (const k in a || {}) {\n    const v = a[k];\n    if (v === false || v == null) continue;\n    n.setAttribute(k, v === true ? \"\" : String(v));\n  }\n  for (const c of kids) if (c != null) n.append(c);\n  return n;\n};\nconst h = (t, a, ...k) =\u003e put(document.createElement(t), a, k);\nconst sv = (t, a, ...k) =\u003e put(document.createElementNS(SVGNS, t), a, k);\nconst tok = (n, fb) =\u003e `var(--wmn-color-${n}, ${fb})`;\nconst num = (v) =\u003e (typeof v === \"number\" ? v : typeof v === \"string\" \u0026\u0026 v.trim() !== \"\" ? Number(v) : Number.NaN);\nconst fmt = (v) =\u003e {\n  if (typeof v !== \"number\" || !Number.isFinite(v)) return String(v ?? \"\");\n  const a = Math.abs(v);\n  if (a !== 0 \u0026\u0026 (a \u003e= 1e6 || a \u003c 1e-3)) return v.toExponential(2).replace(/\\.?0+e/, \"e\");\n  return String(+v.toPrecision(4));\n};\nconst MAX_ROWS = 5000;\nfunction readTable(api) {\n  for (const name of api.dataNames()) {\n    const d = api.data(name);\n    const t = d?.value;\n    if (!t || !Array.isArray(t.columns) || !Array.isArray(t.rows)) continue;\n    const cols = t.columns.map((c) =\u003e (typeof c === \"string\" ? c : c \u0026\u0026 typeof c.name === \"string\" ? c.name : \"\"));\n    const rows = t.rows.slice(0, MAX_ROWS).map((r) =\u003e (Array.isArray(r) ? r : cols.map((c) =\u003e (r ? r[c] : null))));\n    return { name, cols, rows, total: t.rows.length };\n  }\n  return null;\n}\nconst isNumeric = (t, i) =\u003e {\n  let seen = 0;\n  for (const r of t.rows) {\n    if (r[i] === null || r[i] === undefined || r[i] === \"\") continue;\n    if (!Number.isFinite(num(r[i]))) return false;\n    seen++;\n  }\n  return seen \u003e 0;\n};\nfunction niceTicks(lo, hi, n) {\n  if (!Number.isFinite(lo) || !Number.isFinite(hi)) return [0, 1];\n  // a span too big for a float is worked out in halves\n  if (!Number.isFinite(hi - lo)) return niceTicks(lo / 2, hi / 2, n).map((v) =\u003e v * 2);\n  if (!(hi \u003e lo)) {\n    lo -= 1;\n    hi += 1;\n  }\n  const raw = (hi - lo) / Math.max(1, n);\n  // values so large that one unit is below their spacing have no ticks between them\n  if (!(raw \u003e 0)) return [lo, hi];\n  const mag = 10 ** Math.floor(Math.log10(raw));\n  const r = raw / mag;\n  const step = (r \u003c 1.5 ? 1 : r \u003c 3 ? 2 : r \u003c 7 ? 5 : 10) * mag;\n  const out = [];\n  const top = Math.ceil(hi / step) * step + step / 2;\n  // ends when the step no longer moves the value (below float spacing), and never makes more than 60 ticks\n  for (let v = Math.floor(lo / step) * step; v \u003c= top \u0026\u0026 out.length \u003c 60; ) {\n    out.push(+v.toFixed(12));\n    const next = v + step;\n    if (next === v) break;\n    v = next;\n  }\n  return out.length \u003e= 2 ? out : [lo, hi];\n}\n// where v lies between a and b (0 to 1), without overflowing when b - a is beyond a float\nconst frac = (v, a, b) =\u003e (v / 2 - a / 2) / (b / 2 - a / 2 || 1);\n\nconst STYLE = `\n.sl{font:14px/1.4 var(--wmn-font-text,system-ui,sans-serif);color:var(--wmn-color-on-surface,#1c1b1a);padding:8px 4px}\n.sl-title{font:500 16px/1.3 var(--wmn-font-display,serif);margin:0 0 4px;color:var(--wmn-color-chart-title,#1c1b1a)}\n.sl-note{color:var(--wmn-color-on-surface-variant,#57423c);margin:4px 0;font-size:13px}\n.sl-cursor{display:block;border-radius:4px;touch-action:pan-y}\n.sl-cursor:focus-visible,.sl button:focus-visible,.sl input:focus-visible,.sl select:focus-visible{outline:2px solid var(--wmn-color-primary,#a03a19);outline-offset:2px}\n.sl-read{min-height:20px;margin:4px 0;font-size:13px;font-variant-numeric:tabular-nums}\n.sl-controls{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin:6px 0;font-size:13px}\n.sl-controls label{display:inline-flex;gap:8px;align-items:center}\n.sl-controls input[type=range]{width:150px;accent-color:var(--wmn-color-primary,#a03a19)}\n.sl select{font:inherit;font-size:13px;min-height:28px;border-radius:var(--wmn-radius,4px);border:1px solid var(--wmn-color-outline,#8b716a);background:var(--wmn-color-surface-container,#f2edeb);color:var(--wmn-color-on-surface,#1c1b1a)}\n.sl-stats{display:flex;flex-wrap:wrap;gap:4px 18px;margin:4px 0;padding:0;list-style:none;font-size:13px;font-variant-numeric:tabular-nums}\n.sl-stats b{font-weight:500;color:var(--wmn-color-on-surface-variant,#57423c);margin-right:4px}\n`;\n\nconst quantile = (sorted, q) =\u003e {\n  if (sorted.length === 0) return Number.NaN;\n  const at = (sorted.length - 1) * q;\n  const lo = Math.floor(at);\n  const hi = Math.ceil(at);\n  return sorted[lo] + (sorted[hi] - sorted[lo]) * (at - lo);\n};\n\nexport default function view(api) {\n  document.head.append(h(\"style\", {}, STYLE));\n  const root = api.root;\n  const box = h(\"div\", { class: \"sl\" });\n  const plot = h(\"div\", {});\n  const range = h(\"input\", {\n    type: \"range\",\n    min: 1,\n    max: 100,\n    step: 1,\n    value: 12,\n    \"data-k\": \"bins\",\n    \"aria-label\": \"Bins\",\n  });\n  const shown = h(\"output\", {}, \"12\");\n  const pick = h(\n    \"select\",\n    { \"data-k\": \"mode\", \"aria-label\": \"Show\" },\n    ...[\n      [\"both\", \"Histogram and CDF\"],\n      [\"histogram\", \"Histogram\"],\n      [\"cdf\", \"CDF\"],\n    ].map(([v, l]) =\u003e h(\"option\", { value: v }, l)),\n  );\n  const controls = h(\n    \"div\",\n    { class: \"sl-controls\" },\n    h(\"label\", {}, \"Bins\", range, shown),\n    h(\"label\", {}, \"Show\", pick),\n  );\n  controls.hidden = true;\n  box.append(controls, plot);\n  root.append(box);\n  let values = api.values();\n  let width = 0;\n  let cursor = 0;\n  let timer = 0;\n  let sendTimer = 0;\n\n  const send = (key, value) =\u003e {\n    clearTimeout(sendTimer);\n    sendTimer = setTimeout(() =\u003e api.set(key, value), 80);\n  };\n\n  function bin(sorted, count) {\n    const lo = sorted[0];\n    const hi = sorted[sorted.length - 1];\n    // (mixed, not lo + span * k: the span of -1e308 to 1e308 is beyond a float)\n    const at = (k) =\u003e lo * (1 - k) + hi * k;\n    const bins = Array.from({ length: count }, (_, i) =\u003e ({ a: at(i / count), b: at((i + 1) / count), n: 0 }));\n    for (const v of sorted) bins[Math.max(0, Math.min(count - 1, Math.floor(frac(v, lo, hi) * count)))].n++;\n    let run = 0;\n    for (const b of bins) {\n      run += b.n;\n      b.cum = run / sorted.length;\n    }\n    return bins;\n  }\n\n  range.addEventListener(\"input\", () =\u003e {\n    const n = Number(range.value);\n    values = { ...values, bins: n };\n    shown.textContent = String(n);\n    send(\"bins\", n);\n    redraw();\n  });\n  pick.addEventListener(\"change\", () =\u003e {\n    values = { ...values, mode: pick.value };\n    send(\"mode\", pick.value);\n    redraw();\n  });\n\n  function draw() {\n    const hadFocus = plot.contains(document.activeElement);\n    plot.replaceChildren();\n    controls.hidden = true;\n    if (values.title) plot.append(h(\"p\", { class: \"sl-title\" }, String(values.title)));\n    const t = readTable(api);\n    if (!t) {\n      plot.append(\n        h(\n          \"p\",\n          { class: \"sl-note\" },\n          \"No table yet. Add source: and the id of a block that prints a table, then run that block.\",\n        ),\n      );\n      api.status(JSON.stringify({ state: \"empty\" }));\n      return;\n    }\n    const ci = t.cols.includes(values.column)\n      ? t.cols.indexOf(values.column)\n      : t.cols.findIndex((_, i) =\u003e isNumeric(t, i));\n    if (ci \u003c 0) {\n      plot.append(h(\"p\", { class: \"sl-note\", role: \"status\" }, \"The table has no numeric column to count.\"));\n      api.status(JSON.stringify({ state: \"problem\" }));\n      return;\n    }\n    const col = t.cols[ci];\n    const data = t.rows\n      .map((r) =\u003e num(r[ci]))\n      .filter(Number.isFinite)\n      .sort((a, b) =\u003e a - b);\n    if (data.length === 0) {\n      plot.append(h(\"p\", { class: \"sl-note\", role: \"status\" }, `Column ${col} has no numbers.`));\n      return;\n    }\n    const mode = [\"histogram\", \"cdf\", \"both\"].includes(values.mode) ? values.mode : \"both\";\n    const count = Math.max(1, Math.min(100, Math.round(Number(values.bins) || 12)));\n    const bins = bin(data, count);\n    cursor = Math.min(cursor, count - 1);\n    const mean = data.reduce((s, v) =\u003e s + v, 0) / data.length;\n    plot.append(\n      h(\n        \"ul\",\n        { class: \"sl-stats\", \"aria-label\": `Summary of ${col}` },\n        ...[\n          [\"n\", String(data.length)],\n          [\"mean\", fmt(mean)],\n          [\"median\", fmt(quantile(data, 0.5))],\n          [\"p95\", fmt(quantile(data, 0.95))],\n          [\"p99\", fmt(quantile(data, 0.99))],\n          [\"max\", fmt(data[data.length - 1])],\n        ].map(([k, v]) =\u003e h(\"li\", {}, h(\"b\", {}, k), v)),\n      ),\n    );\n    const W = Math.max(300, Math.floor(width || root.clientWidth || 600));\n    const H = 260;\n    const m = { l: 52, r: mode === \"histogram\" ? 14 : 48, t: 10, b: 42 };\n    const iw = W - m.l - m.r;\n    const ih = H - m.t - m.b;\n    const axis = tok(\"chart-axis\", \"#8b716a\");\n    const grid = tok(\"chart-grid\", \"#dec0b8\");\n    const label = tok(\"chart-label\", \"#57423c\");\n    const lo = bins[0].a;\n    const hi = bins[bins.length - 1].b;\n    const X = (v) =\u003e m.l + frac(v, lo, hi) * iw;\n    const maxN = Math.max(...bins.map((b) =\u003e b.n));\n    const nt = niceTicks(0, maxN, 5);\n    const topN = nt[nt.length - 1] || 1;\n    const Yn = (n) =\u003e m.t + ih - (n / topN) * ih;\n    const Yp = (p) =\u003e m.t + ih - p * ih;\n    const svg = sv(\"svg\", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, \"aria-hidden\": \"true\", focusable: \"false\" });\n    if (mode === \"cdf\") {\n      for (const p of [0, 0.25, 0.5, 0.75, 1]) {\n        svg.append(sv(\"line\", { x1: m.l, x2: W - m.r, y1: Yp(p), y2: Yp(p), stroke: grid }));\n        svg.append(\n          sv(\n            \"text\",\n            { x: m.l - 6, y: Yp(p) + 4, \"text-anchor\": \"end\", fill: label, \"font-size\": 12 },\n            `${Math.round(p * 100)}%`,\n          ),\n        );\n      }\n    } else {\n      for (const v of nt) {\n        svg.append(sv(\"line\", { x1: m.l, x2: W - m.r, y1: Yn(v), y2: Yn(v), stroke: v === 0 ? axis : grid }));\n        svg.append(\n          sv(\"text\", { x: m.l - 6, y: Yn(v) + 4, \"text-anchor\": \"end\", fill: label, \"font-size\": 12 }, fmt(v)),\n        );\n      }\n    }\n    if (mode === \"both\")\n      for (const p of [0, 0.5, 1])\n        svg.append(\n          sv(\"text\", { x: W - m.r + 6, y: Yp(p) + 4, fill: label, \"font-size\": 12 }, `${Math.round(p * 100)}%`),\n        );\n    for (const v of niceTicks(lo, hi, Math.max(2, Math.floor(iw / 90))).filter((v) =\u003e v \u003e= lo \u0026\u0026 v \u003c= hi))\n      svg.append(\n        sv(\"text\", { x: X(v), y: H - m.b + 18, \"text-anchor\": \"middle\", fill: label, \"font-size\": 12 }, fmt(v)),\n      );\n    svg.append(sv(\"text\", { x: m.l + iw / 2, y: H - 6, \"text-anchor\": \"middle\", fill: label, \"font-si     }
  }
  var ASSET_TYPES = /^(image\/(svg\+xml|png|jpeg|webp|gif)|text\/(css|plain|csv)|application\/json|font\/woff2)$/
  function startView(d) {
    var root = doc.createElement('div')
    root.id = 'wmn-view'
    doc.body.appendChild(root)
    var assets = {}
    var list = Array.isArray(d.assets) ? d.assets : []
    for (var i = 0; i < list.length; i++) {
      var a = list[i]
      if (a && typeof a.path === 'string' && typeof a.type === 'string' && ASSET_TYPES.test(a.type) && a.bytes instanceof ArrayBuffer) assets[a.path] = a
    }
    viewValues = copy(d.values) || {}
    viewData = copy(d.data) || {}
    var block = freeze(copy(d.block) || {})
    viewApi = freeze({
      root: root,
      block: block,
      values: function () { return copy(viewValues) },
      data: function (name) { return copy(viewData[String(name)]) },
      dataNames: function () { return Object.keys(viewData) },
      onValues: function (fn) { if (typeof fn === 'function') viewListeners.values.push(cpuOn ? measured(fn) : fn) },
      onData: function (fn) { if (typeof fn === 'function') viewListeners.data.push(cpuOn ? measured(fn) : fn) },
      set: function (key, value) {
        var v = typeof value === 'number' || typeof value === 'boolean' ? value : String(value).slice(0, 4096)
        send({ t: 'set', key: String(key).slice(0, 100), value: v })
      },
      run: function (id) { send({ t: 'run', block: String(id).slice(0, 100) }) },
      status: function (text) { send({ t: 'status', text: String(text).slice(0, 2000) }) },
      done: function (info) { send({ t: 'done', info: copy(info) }) },
      asset: function (path) {
        var a = assets[String(path)]
        if (!a) return null
        if (!assetUrls[a.path]) {
          // an SVG asset as a data: URL: an <img> shows it the same, and it is not a URL the view could open as a
          // document (the app's frame-src allows no data: or blob: navigation)
          if (a.type === 'image/svg+xml') {
            var bytes = new Uint8Array(a.bytes), bin = ''
            for (var i = 0; i < bytes.length; i += 32768) bin += String.fromCharCode.apply(null, Array.prototype.slice.call(bytes.subarray(i, i + 32768)))
            assetUrls[a.path] = 'data:image/svg+xml;base64,' + btoa(bin)
          } else assetUrls[a.path] = createObjectURL(new BlobC([a.bytes], { type: a.type }))
        }
        return assetUrls[a.path]
      },
      assetText: function (path) {
        var a = assets[String(path)]
        return a ? new TextDecoder().decode(a.bytes) : null
      },
    })
    var url = createObjectURL(new BlobC([d.code], { type: 'text/javascript' }))
    import(url).then(function (m) {
      revokeObjectURL(url)
      var fn = m && m.default
      if (typeof fn !== 'function') return send({ t: 'done', info: { error: 'the view module has no default export function' } })
      ;(cpuOn ? measured(fn) : fn)(viewApi)
      if (RO) new RO(reportSize).observe(doc.documentElement)
      reportSize()
    }, function (e) {
      revokeObjectURL(url)
      send({ t: 'done', info: { error: String(e && e.message || e).slice(0, 200) } })
    })
  }

  function onPort(e) {
    var d = e.data
    if (!d || typeof d !== 'object') return
    if (d.t === 'ping') send({ t: 'pong', n: d.n, cpu: Math.round(cpuMs) })
    else if (d.t === 'theme') {
      var n = typeof d.n === 'number' ? d.n : null
      var why = themeApi ? themeApi.apply(d) : 'no-theme-runtime'
      send(why ? { t: 'theme-refused', n: n, why: String(why).slice(0, 80) } : { t: 'themed', n: n })
    }
    else if (d.t === 'view' && !rendered && typeof d.code === 'string') {
      rendered = true
      if (d.cpu === true) installCpuAccounting()
      send({ t: 'rendering' })
      self.__wmnDone = function (info) { send({ t: 'done', info: info === undefined ? null : info }) }
      startView(d)
    }
    else if (d.t === 'values' && viewApi && d.values && typeof d.values === 'object') { viewValues = copy(d.values) || {}; deliver('values', viewValues) }
    else if (d.t === 'data' && viewApi && typeof d.name === 'string') { viewData[d.name] = { mime: String(d.mime), value: copy(d.value) }; deliver('data', { name: d.name, mime: String(d.mime), value: d.value }) }
    else if (d.t === 'render' && !rendered && typeof d.html === 'string') {
      rendered = true
      if (d.cpu === true) installCpuAccounting()
      send({ t: 'rendering' })
      // Renderer templates call this when their chart is drawn; output code may call it too (it is only a signal).
      self.__wmnDone = function (info) { send({ t: 'done', info: info === undefined ? null : info }) }
      ;(cpuOn ? measured(render) : render)(d.html)
    }
  }
  function onInit(e) {
    if (port || (e.source !== parent && e.source !== self) || !e.data || e.data.wmn !== 'init' || !e.ports || e.ports.length !== 1) return
    removeEventListener('message', onInit)
    port = e.ports[0]
    port.onmessage = onPort
  }
  addEventListener('message', onInit)
  parent.postMessage({ wmn: 'ready' }, '*')
})()
</script>
<script>// The driver of a live frame on a published page (ROADMAP 13.11, D-216). It runs in the frame document, after the output frame's own
// bootstrap (packages/outputs/frame/frame.html, the one the app uses: its locks, its theme runtime, its view api) and does the part
// the app's host does from outside: it hands the bootstrap a port, sends the theme, the declared values and the tables the page was
// saved with, checks what the view asks to write back, and (when the page has a script of its own) talks to the page.
//
// The document is opaque-origin (the iframe is `sandbox="allow-scripts"`, never allow-same-origin), has no network (CSP connect-src
// 'none') and carries everything it needs: this script, the bootstrap and the theme runtime are inline and named by hash in the
// frame's CSP; the view module, the tables and the parameters are data in `<script type="application/json" id="wmn-live-data">`.
// Nothing here evaluates text: the view module is imported from a blob: URL by the bootstrap, as in the app.
//
// Messages with the page (window.postMessage, no secrets in either direction):
//   frame -> page  {wmn:'live', t:'size', h} | {wmn:'live', t:'run', block, userActive} | {wmn:'live', t:'ready'}
//   page  -> frame {wmn:'live-in', t:'data', name, mime, value} | {wmn:'live-in', t:'reset'}      (only from the parent window)
//                  | {wmn:'live-in', t:'param', key, value}    a scrubber of the page that the document bound to a declared parameter (13.12)
(() => {
  if (window.origin !== "null") return; // not in a sandbox: nothing runs (live.ts ORIGIN_GUARD does the same before the bootstrap)
  const nonce = window.__wmnLiveNonce;
  delete window.__wmnLiveNonce;
  const doc = document;
  const parentWin = window.parent;
  const JSONparse = JSON.parse;
  const JSONstr = JSON.stringify;
  const hasOwn = Object.prototype.hasOwnProperty;
  const holder = doc.getElementById("wmn-live-data");
  if (!holder) return;
  let cfg;
  try {
    cfg = JSONparse(holder.textContent || "");
  } catch (x) {
    return;
  }
  if (!cfg || typeof cfg !== "object") return;
  const original = JSONstr({ values: cfg.values || {}, data: cfg.data || {} });

  function say(text, cls) {
    let n = doc.getElementById("wmn-live-note");
    if (!n) {
      n = doc.createElement("p");
      n.id = "wmn-live-note";
      doc.body.appendChild(n);
    }
    n.className = cls || "";
    n.textContent = String(text).slice(0, 400);
  }
  function status(text) {
    let s = doc.getElementById("wmn-live-status");
    if (!s) {
      s = doc.createElement("div");
      s.id = "wmn-live-status";
      s.setAttribute("role", "status");
      doc.body.appendChild(s);
    }
    s.textContent = String(text).slice(0, 2000);
  }

  // ---- what a view may write back: a declared parameter, a value that fits it (the same rules as the app's `checkUseSet`)
  const params = cfg.params && typeof cfg.params === "object" ? cfg.params : {};
  function check(key, value) {
    if (typeof key !== "string" || !hasOwn.call(params, key)) return null;
    const p = params[key];
    if (!p || typeof p !== "object") return null;
    if (p.type === "number") {
      if (typeof value !== "number" || !isFinite(value)) return null;
      if ((typeof p.min === "number" && value < p.min) || (typeof p.max === "number" && value > p.max)) return null;
      return { v: value };
    }
    if (p.type === "select")
      return typeof value === "string" && Array.isArray(p.options) && p.options.indexOf(value) >= 0
        ? { v: value }
        : null;
    if (p.type === "boolean") return typeof value === "boolean" ? { v: value } : null;
    if (p.type === "text")
      return typeof value === "string" && value.length <= (typeof p.maxLength === "number" ? p.maxLength : 0)
        ? { v: value }
        : null;
    return null;
  }
  let values = JSONparse(JSONstr(cfg.values || {}));
  let refused = 0;
  const setTimes = [];

  // ---- the port to the bootstrap
  const channel = new MessageChannel();
  const core = channel.port2;
  let themeN = 0;
  let lastInput = 0;
  const dark = typeof matchMedia === "function" ? matchMedia("(prefers-color-scheme: dark)") : null;
  function sendTheme() {
    const name = dark && dark.matches ? "dark" : "light";
    const vars = cfg.theme && cfg.theme[name];
    if (vars) core.postMessage({ t: "theme", theme: name, vars: vars, n: ++themeN });
  }
  function toPage(msg) {
    msg.wmn = "live";
    msg.nonce = nonce;
    try {
      parentWin.postMessage(msg, "*");
    } catch (x) {}
  }
  core.onmessage = (e) => {
    const m = e.data;
    if (!m || typeof m !== "object") return;
    if (m.t === "size") toPage({ t: "size", h: m.h });
    else if (m.t === "input") lastInput = Date.now();
    else if (m.t === "status" && typeof m.text === "string") status(m.text);
    else if (m.t === "done") {
      const info = m.info;
      if (info && typeof info === "object" && typeof info.error === "string")
        say("This view could not start: " + info.error, "wmn-live-error");
    } else if (m.t === "set") {
      const now = Date.now();
      while (setTimes.length && now - setTimes[0] >= 1000) setTimes.shift();
      const ok = setTimes.length < 20 ? check(m.key, m.value) : null;
      if (!ok) {
        refused++;
        holder.setAttribute("data-refused", String(refused));
        return;
      }
      setTimes.push(now);
      values[m.key] = ok.v;
      core.postMessage({ t: "values", values: values });
    } else if (m.t === "run" && typeof m.block === "string") {
      const fed = Array.isArray(cfg.fed) ? cfg.fed : [];
      if (fed.indexOf(m.block) >= 0) toPage({ t: "run", block: m.block, userActive: Date.now() - lastInput < 3000 });
    }
  };

  function assets() {
    const out = [];
    const list = Array.isArray(cfg.assets) ? cfg.assets : [];
    for (let i = 0; i < list.length; i++) {
      const a = list[i];
      if (!a || typeof a.b64 !== "string") continue;
      try {
        const bin = atob(a.b64);
        const bytes = new Uint8Array(bin.length);
        for (let j = 0; j < bin.length; j++) bytes[j] = bin.charCodeAt(j);
        out.push({ path: a.path, type: a.type, bytes: bytes.buffer });
      } catch (x) {}
    }
    return out;
  }

  window.postMessage({ wmn: "init" }, "*", [channel.port1]);
  sendTheme();
  if (dark && dark.addEventListener) dark.addEventListener("change", sendTheme);
  core.postMessage({
    t: "view",
    code: String(cfg.code || ""),
    assets: assets(),
    block: cfg.block || {},
    values: values,
    data: cfg.data || {},
  });

  // ---- the page (when it has a script): tables from runs in the reader's browser, and a way back to the saved ones
  const fedNames = Array.isArray(cfg.fed) ? cfg.fed : [];
  const bound = Array.isArray(cfg.bound) ? cfg.bound : [];
  const accepts = Array.isArray(cfg.accepts) ? cfg.accepts : [];
  window.addEventListener("message", (e) => {
    if (e.source !== parentWin) return;
    const d = e.data;
    if (!d || typeof d !== "object" || d.wmn !== "live-in") return;
    if (d.t === "data" && typeof d.name === "string" && typeof d.mime === "string") {
      if (fedNames.indexOf(d.name) < 0 || accepts.indexOf(d.mime) < 0) return;
      core.postMessage({ t: "data", name: d.name, mime: d.mime, value: d.value });
    } else if (d.t === "param" && typeof d.key === "string") {
      // a scrubber the document bound (`uses=` and a declared parameter of that name): the same check as a write by the view (declared,
      // typed, in range, an option, within the length); a name that is not bound, or a value that does not fit, changes nothing
      // (a drag is many values: at most twenty a second, the limit a write by the view has)
      const now = Date.now();
      while (setTimes.length && now - setTimes[0] >= 1000) setTimes.shift();
      const ok = bound.indexOf(d.key) >= 0 && setTimes.length < 20 ? check(d.key, d.value) : null;
      if (ok) setTimes.push(now);
      if (!ok) {
        refused++;
        holder.setAttribute("data-refused", String(refused));
        return;
      }
      values[d.key] = ok.v;
      core.postMessage({ t: "values", values: values });
    } else if (d.t === "reset") {
      const o = JSONparse(original);
      values = o.values;
      core.postMessage({ t: "values", values: values });
      for (const name in o.data)
        if (hasOwn.call(o.data, name))
          core.postMessage({ t: "data", name: name, mime: o.data[name].mime, value: o.data[name].value });
    }
  });
  toPage({ t: "ready" });
})();
</script>
