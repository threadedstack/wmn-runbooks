      var why = themeApi ? themeApi.apply(d) : 'no-theme-runtime'
      send(why ? { t: 'theme-refused', n: n, why: String(why).slice(0, 80) } : { t: 'themed', n: n })
    }
    else if (d.t === 'view' && !rendered && typeof d.code === 'string') {
      rendered = true
      if (d.cpu === true) installCpuAccounting()
      send({ t: 'rendering' })
      self.__wmnDone = function (info) { send({ t: 'done', info: info === undefined ? null : info }) }
      startView(d)
    }
    else if (d.t === 'values' && viewApi && d.values && typeof d.values === 'object') { viewValues = copy(d.values) || {}; deliver('values', viewValues) }
    else if (d.t === 'data' && viewApi && typeof d.name === 'string') { viewData[d.name] = { mime: String(d.mime), value: copy(d.value) }; deliver('data', { name: d.name, mime: String(d.mime), value: d.value }) }
    else if (d.t === 'render' && !rendered && typeof d.html === 'string') {
      rendered = true
      if (d.cpu === true) installCpuAccounting()
      send({ t: 'rendering' })
      // Renderer templates call this when their chart is drawn; output code may call it too (it is only a signal).
      self.__wmnDone = function (info) { send({ t: 'done', info: info === undefined ? null : info }) }
      ;(cpuOn ? measured(render) : render)(d.html)
    }
  }
  function onInit(e) {
    if (port || (e.source !== parent && e.source !== self) || !e.data || e.data.wmn !== 'init' || !e.ports || e.ports.length !== 1) return
    removeEventListener('message', onInit)
    port = e.ports[0]
    port.onmessage = onPort
  }
  addEventListener('message', onInit)
  parent.postMessage({ wmn: 'ready' }, '*')
})()
</script>
<script>// The driver of a live frame on a published page (ROADMAP 13.11, D-216). It runs in the frame document, after the output frame's own
// bootstrap (packages/outputs/frame/frame.html, the one the app uses: its locks, its theme runtime, its view api) and does the part
// the app's host does from outside: it hands the bootstrap a port, sends the theme, the declared values and the tables the page was
// saved with, checks what the view asks to write back, and (when the page has a script of its own) talks to the page.
//
// The document is opaque-origin (the iframe is `sandbox="allow-scripts"`, never allow-same-origin), has no network (CSP connect-src
// 'none') and carries everything it needs: this script, the bootstrap and the theme runtime are inline and named by hash in the
// frame's CSP; the view module, the tables and the parameters are data in `<script type="application/json" id="wmn-live-data">`.
// Nothing here evaluates text: the view module is imported from a blob: URL by the bootstrap, as in the app.
//
// Messages with the page (window.postMessage, no secrets in either direction):
//   frame -> page  {wmn:'live', t:'size', h} | {wmn:'live', t:'run', block, userActive} | {wmn:'live', t:'ready'}
//   page  -> frame {wmn:'live-in', t:'data', name, mime, value} | {wmn:'live-in', t:'reset'}      (only from the parent window)
//                  | {wmn:'live-in', t:'param', key, value}    a scrubber of the page that the document bound to a declared parameter (13.12)
(() => {
  if (window.origin !== "null") return; // not in a sandbox: nothing runs (live.ts ORIGIN_GUARD does the same before the bootstrap)
  const nonce = window.__wmnLiveNonce;
  delete window.__wmnLiveNonce;
  const doc = document;
  const parentWin = window.parent;
  const JSONparse = JSON.parse;
  const JSONstr = JSON.stringify;
  const hasOwn = Object.prototype.hasOwnProperty;
  const holder = doc.getElementById("wmn-live-data");
  if (!holder) return;
  let cfg;
  try {
    cfg = JSONparse(holder.textContent || "");
  } catch (x) {
    return;
  }
  if (!cfg || typeof cfg !== "object") return;
  const original = JSONstr({ values: cfg.values || {}, data: cfg.data || {} });

  function say(text, cls) {
    let n = doc.getElementById("wmn-live-note");
    if (!n) {
      n = doc.createElement("p");
      n.id = "wmn-live-note";
      doc.body.appendChild(n);
    }
    n.className = cls || "";
    n.textContent = String(text).slice(0, 400);
  }
  function status(text) {
    let s = doc.getElementById("wmn-live-status");
    if (!s) {
      s = doc.createElement("div");
      s.id = "wmn-live-status";
      s.setAttribute("role", "status");
      doc.body.appendChild(s);
    }
    s.textContent = String(text).slice(0, 2000);
  }

  // ---- what a view may write back: a declared parameter, a value that fits it (the same rules as the app's `checkUseSet`)
  const params = cfg.params && typeof cfg.params === "object" ? cfg.params : {};
  function check(key, value) {
    if (typeof key !== "string" || !hasOwn.call(params, key)) return null;
    const p = params[key];
    if (!p || typeof p !== "object") return null;
    if (p.type === "number") {
      if (typeof value !== "number" || !isFinite(value)) return null;
      if ((typeof p.min === "number" && value < p.min) || (typeof p.max === "number" && value > p.max)) return null;
      return { v: value };
    }
    if (p.type === "select")
      return typeof value === "string" && Array.isArray(p.options) && p.options.indexOf(value) >= 0
        ? { v: value }
        : null;
    if (p.type === "boolean") return typeof value === "boolean" ? { v: value } : null;
    if (p.type === "text")
      return typeof value === "string" && value.length <= (typeof p.maxLength === "number" ? p.maxLength : 0)
        ? { v: value }
        : null;
    return null;
  }
  let values = JSONparse(JSONstr(cfg.values || {}));
  let refused = 0;
  const setTimes = [];

  // ---- the port to the bootstrap
  const channel = new MessageChannel();
  const core = channel.port2;
  let themeN = 0;
  let lastInput = 0;
  const dark = typeof matchMedia === "function" ? matchMedia("(prefers-color-scheme: dark)") : null;
  function sendTheme() {
    const name = dark && dark.matches ? "dark" : "light";
    const vars = cfg.theme && cfg.theme[name];
    if (vars) core.postMessage({ t: "theme", theme: name, vars: vars, n: ++themeN });
  }
  function toPage(msg) {
    msg.wmn = "live";
    msg.nonce = nonce;
    try {
      parentWin.postMessage(msg, "*");
    } catch (x) {}
  }
  core.onmessage = (e) => {
    const m = e.data;
    if (!m || typeof m !== "object") return;
    if (m.t === "size") toPage({ t: "size", h: m.h });
    else if (m.t === "input") lastInput = Date.now();
    else if (m.t === "status" && typeof m.text === "string") status(m.text);
    else if (m.t === "done") {
      const info = m.info;
      if (info && typeof info === "object" && typeof info.error === "string")
        say("This view could not start: " + info.error, "wmn-live-error");
    } else if (m.t === "set") {
      const now = Date.now();
      while (setTimes.length && now - setTimes[0] >= 1000) setTimes.shift();
      const ok = setTimes.length < 20 ? check(m.key, m.value) : null;
      if (!ok) {
        refused++;
        holder.setAttribute("data-refused", String(refused));
        return;
      }
      setTimes.push(now);
      values[m.key] = ok.v;
      core.postMessage({ t: "values", values: values });
    } else if (m.t === "run" && typeof m.block === "string") {
      const fed = Array.isArray(cfg.fed) ? cfg.fed : [];
      if (fed.indexOf(m.block) >= 0) toPage({ t: "run", block: m.block, userActive: Date.now() - lastInput < 3000 });
    }
  };

  function assets() {
    const out = [];
    const list = Array.isArray(cfg.assets) ? cfg.assets : [];
    for (let i = 0; i < list.length; i++) {
      const a = list[i];
      if (!a || typeof a.b64 !== "string") continue;
      try {
        const bin = atob(a.b64);
        const bytes = new Uint8Array(bin.length);
        for (let j = 0; j < bin.length; j++) bytes[j] = bin.charCodeAt(j);
        out.push({ path: a.path, type: a.type, bytes: bytes.buffer });
      } catch (x) {}
    }
    return out;
  }

  window.postMessage({ wmn: "init" }, "*", [channel.port1]);
  sendTheme();
  if (dark && dark.addEventListener) dark.addEventListener("change", sendTheme);
  core.postMessage({
    t: "view",
    code: String(cfg.code || ""),
    assets: assets(),
    block: cfg.block || {},
    values: values,
    data: cfg.data || {},
  });

  // ---- the page (when it has a script): tables from runs in the reader's browser, and a way back to the saved ones
  const fedNames = Array.isArray(cfg.fed) ? cfg.fed : [];
  const bound = Array.isArray(cfg.bound) ? cfg.bound : [];
  const accepts = Array.isArray(cfg.accepts) ? cfg.accepts : [];
  window.addEventListener("message", (e) => {
    if (e.source !== parentWin) return;
    const d = e.data;
    if (!d || typeof d !== "object" || d.wmn !== "live-in") return;
    if (d.t === "data" && typeof d.name === "string" && typeof d.mime === "string") {
      if (fedNames.indexOf(d.name) < 0 || accepts.indexOf(d.mime) < 0) return;
      core.postMessage({ t: "data", name: d.name, mime: d.mime, value: d.value });
    } else if (d.t === "param" && typeof d.key === "string") {
      // a scrubber the document bound (`uses=` and a declared parameter of that name): the same check as a write by the view (declared,
      // typed, in range, an option, within the length); a name that is not bound, or a value that does not fit, changes nothing
      // (a drag is many values: at most twenty a second, the limit a write by the view has)
      const now = Date.now();
      while (setTimes.length && now - setTimes[0] >= 1000) setTimes.shift();
      const ok = bound.indexOf(d.key) >= 0 && setTimes.length < 20 ? check(d.key, d.value) : null;
      if (ok) setTimes.push(now);
      if (!ok) {
        refused++;
        holder.setAttribute("data-refused", String(refused));
        return;
      }
      values[d.key] = ok.v;
      core.postMessage({ t: "values", values: values });
    } else if (d.t === "reset") {
      const o = JSONparse(original);
      values = o.values;
      core.postMessage({ t: "values", values: values });
      for (const name in o.data)
        if (hasOwn.call(o.data, name))
          core.postMessage({ t: "data", name: name, mime: o.data[name].mime, value: o.data[name].value });
    }
  });
  toPage({ t: "ready" });
})();
</script>
